name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck
      - name: Shellcheck
        run: shellcheck install.sh tests/*.sh
      - name: Validate catalog, entries and settings
        run: tests/validate.sh
      - name: Test validator
        run: tests/test_validate.sh
      - name: Test installer
        run: tests/test_install.sh
